name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  data-and-web:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install data dependencies
        run: npm ci
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Fetch locked public sources
        run: |
          npm run fetch:sources
          npm run fetch:historical-sources
      - name: Validate data and build the static site
        run: npm run check
      - name: Dependency audit
        run: |
          npm audit --audit-level=high
          npm --prefix web audit --audit-level=high
      - name: Upload static build
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-dist
          path: web/dist
          if-no-files-found: error

  neo4j-import-idempotence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run Neo4j double import verification
        env:
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: Neo4jTest-${{ github.run_id }}-${{ github.run_number }}!P
        run: |
          cd neo4j
          bash import-cycle.sh
